<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Class Runner · INF 125 Ethics Lab</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f5fa;color:#172137}*{box-sizing:border-box}body{margin:0}header{background:#13203a;color:#fff;padding:18px max(18px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}header h1{font-size:20px;margin:0}header small{color:#b9cce7}nav{display:flex;gap:7px}nav a{padding:8px 10px;color:white;border:1px solid #60718e;border-radius:9px;text-decoration:none;font-size:13px}nav a.active{background:white;color:#13203a}main{max-width:1200px;margin:auto;padding:19px}h2{margin:0 0 9px;font-size:25px}h3{margin:0 0 9px}.card{background:white;border:1px solid #dae2ed;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px #17213708}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.muted{color:#596b82}.small{font-size:13px}.tiny{font-size:11px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#e6edfa;color:#2451a1;font-weight:750;font-size:11px;letter-spacing:.05em}.button,button{background:#2563eb;color:#fff;border:0;border-radius:10px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#ebf0fa;color:#203a65}button:disabled{opacity:.5;cursor:not-allowed}button.danger{background:#bd3956}input,textarea,select{width:100%;padding:11px 12px;border:1px solid #b8c5d6;border-radius:9px;font:inherit;background:white;color:#172137}label{display:block;margin:12px 0 6px;font-weight:700;font-size:13px}textarea{min-height:80px;resize:vertical}fieldset{border:1px solid #d4deed;border-radius:12px;padding:12px;margin:13px 0}legend{font-weight:750}.option{display:flex;align-items:center;gap:8px;padding:8px 0}.option input{width:auto}.team{border:1px solid #d9e1ed;border-top:6px solid var(--c);border-radius:13px;padding:15px;background:#fff}.team h3{margin:5px 0}.team p{font-size:14px}.panel{padding:13px;border-radius:10px;background:#edf3fb;margin:10px 0}.slides{background:linear-gradient(130deg,#0f1b32,#283a61);color:#fff;padding:clamp(23px,5vw,64px);border-radius:18px;min-height:340px;display:flex;flex-direction:column;justify-content:center}.slides h2{font-size:clamp(28px,4.4vw,55px);line-height:1.1}.slides p{font-size:clamp(17px,2vw,26px);max-width:850px}.slides .badge{align-self:flex-start;background:#3c5279;color:#e6f0ff}.slidefooter{opacity:.72;font-size:12px;margin-top:30px}.meter{height:12px;border-radius:99px;background:#dce5f1;overflow:hidden;display:flex}.meter span{background:#2866e7}.notice{background:#fff5e4;border-left:4px solid #d7a13a;padding:12px 15px;border-radius:8px}.success{background:#e2f6e9;color:#16542a;padding:12px;border-radius:9px}.mono{font-family:ui-monospace,monospace}.scroll{max-height:450px;overflow:auto}.entry{border-bottom:1px solid #e3e8f1;padding:10px 0}.entry p{margin:5px 0}.phasebtn{text-align:left;width:100%;background:#edf2fc;color:#1f3559}.phasebtn.selected{background:#234fbd;color:white}.kpi{font-size:32px;font-weight:800}.alert{font-size:12px;color:#9a3b3b}.bar{height:8px;border-radius:10px;background:#d5e1f1}.bar>span{height:8px;display:block;background:#3875e5;border-radius:10px}.projector{min-height:78vh}.projector .slides{min-height:58vh}#status{font-size:12px;color:#c3d8f1}a{color:#2563eb}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #f3ad25;outline-offset:2px}@media(max-width:750px){.grid,.g4{grid-template-columns:1fr}main{padding:11px}.card{padding:15px}.slides{min-height:290px}nav a{font-size:11px;padding:7px}}
</style></head><body><header><div><div class="badge" style="background:#31547f;color:white">INF 125 · NOV 10 · 75 MIN</div><h1>Class Runner · AI Ethics + Experience Design</h1><small>Slide 14+ content · Group Mode · Gen Ed Signature Assignment</small></div><nav><a id="nav-student" href="#student">Student</a><a id="nav-room" href="#room">Projector</a><a id="nav-instructor" href="#instructor">Instructor</a></nav><div id="status">Connecting…</div></header><main id="app"></main><script>
'use strict';
let data=null,admin=null,pin=sessionStorage.getItem('instructorPin')||'',userId=localStorage.getItem('ethicsUserId')||'',userName=localStorage.getItem('ethicsUserName')||'',userTeam=localStorage.getItem('ethicsUserTeam')||'',message='',lastPhase=-1;
const app=document.querySelector('#app');const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mode=()=>['room','instructor','student'].includes(location.hash.slice(1))?location.hash.slice(1):'student';
const q=(x)=>document.querySelector(x),el=(tag,attrs={},inner='')=>`<${tag} ${Object.entries(attrs).map(([k,v])=>`${k}="${escapeHTML(v)}"`).join(' ')}>${inner}</${tag}>`;
const c=(id)=>data.cases.find(x=>x.id===id);const pp=()=>data.phases[data.phase];const slide=()=>pp().slides[data.slide]||pp().slides[0];
async function api(path,method='GET',body=null,protectedCall=false){const r=await fetch(path,{method,headers:{...(body?{'Content-Type':'application/json'}:{}),...(protectedCall?{'X-Instructor-Pin':pin}:{})},body:body?JSON.stringify(body):undefined});const x=await r.json();if(!r.ok)throw Error(x.error||'Request failed');return x}
async function sync(){try{data=await api('/api/state');q('#status').textContent='Live session connected';render()}catch{q('#status').textContent='Connection lost · retrying'}}
const es=new EventSource('/api/events');es.onmessage=e=>{data=JSON.parse(e.data);q('#status').textContent='Live session connected';if(lastPhase!==data.phase){lastPhase=data.phase;message=''}render()};es.onerror=()=>q('#status').textContent='Reconnecting…';
function header(){const current=mode();document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.id==='nav-'+current))}
function timeline(){return `<div class="meter">${data.phases.map((p,i)=>`<span style="width:${p.minutes/75*100}%;background:${i<=data.phase?'#2f72eb':'#dce5f1'}"></span>`).join('')}</div>`}
function caseCard(x){return `<div class="team" style="--c:${x.color}"><span class="badge">${escapeHTML(x.team.toUpperCase())} TEAM · CASE ${x.letter} · SLIDE ${x.slide}</span><h3>${escapeHTML(x.title)}</h3><p>${escapeHTML(x.summary)}</p><strong>${escapeHTML(x.question)}</strong></div>`}
function room(){const p=pp(),s=slide();return `<div class="projector"><div class="row between"><span class="badge">${data.phase+1} / ${data.phases.length} · ${p.minutes} MIN</span><strong>${escapeHTML(p.name)}</strong></div><div class="slides"><span class="badge">SOURCE SLIDE ${s.n} · INF 125</span><h2>${escapeHTML(s.title)}</h2><p>${escapeHTML(s.body)}</p><div class="slidefooter">Dr. Brandi Neal · EXPLORE → QUESTION → JUDGE → APPLY</div></div>${data.phase===2?`<div class="grid g4" style="margin-top:14px">${data.cases.map(x=>`<div class="team" style="--c:${x.color}"><strong>${escapeHTML(x.team)} · ${escapeHTML(x.title)}</strong><p>${escapeHTML(x.question)}</p></div>`).join('')}</div>`:''}${data.phase===3?'<div class="card"><strong>Gallery walk:</strong> Challenge one other team’s assumption, missing stakeholder, underestimated risk, or safeguard. Leave a question—not a grade.</div>':''}${data.phase===4?'<div class="card"><strong>Design brief:</strong> Propose a 5–15 minute digital activity for visiting high school students. What will they do, learn, and discuss?</div>':''}${data.reveal?'<div class="card"><strong>Instructor reveal:</strong> Can you identify a tradeoff or missing perspective that would change your original verdict?</div>':''}<div class="card row between"><span>Participate on your device · Choose Student</span><span class="badge">${data.counts.joined} joined · ${data.counts.submitted} responses</span></div></div>`}
function field(name,label,placeholder='',tag='textarea',required=true){return `<label for="${name}">${label}</label>${tag==='textarea'?`<textarea id="${name}" name="${name}" placeholder="${escapeHTML(placeholder)}" ${required?'required':''}></textarea>`:`<input id="${name}" name="${name}" placeholder="${escapeHTML(placeholder)}" ${required?'required':''}>`}`}
function choose(name,options){return `<fieldset><legend>${escapeHTML(name)}</legend>${options.map((x,i)=>`<label class="option"><input type="radio" name="${escapeHTML(name)}" value="${escapeHTML(x)}" ${i===0?'required':''}> ${escapeHTML(x)}</label>`).join('')}</fieldset>`}
function form(type,body,button='Submit response'){return `<form data-submit="${type}">${body}<p class="small muted">Your response is saved with your chosen class nickname and group. Avoid sharing sensitive personal information.</p><button type="submit">${button}</button></form>`}
function join(){return `<section class="card"><h2>Join today's AI Ethics Lab</h2><p>Use a first name, preferred nickname, or an instructor-approved identifier. Choose your table's color zone.</p><form id="joinform">${field('name','Nickname','e.g., Alex','input')}<label for="team">Your color team</label><select name="team" id="team">${data.cases.map(x=>`<option value="${x.id}">${x.team} · ${escapeHTML(x.title)}</option>`).join('')}</select><p><button>Join session →</button></p></form></section>`}
function student(){if(!userId)return join();const p=pp(),team=c(userTeam),g=`<section class="card"><div class="row between"><div><span class="badge">${p.minutes}-MIN ACTIVITY</span><h2>${escapeHTML(p.name)}</h2><span class="small muted">${escapeHTML(userName)} · ${team?.team||'Unassigned'} Team</span></div><button class="secondary" id="switchteam">Change team</button></div>${timeline()}</section>`;let content='';
if(data.phase===0)content=form('pulse',`${choose('Your opening opinion',['AI can be helpful but should have limits','AI should be used as much as possible','AI use worries me'])}${choose('Which ethical concern interests you most?',['Fairness','Privacy','Transparency','Ownership','Accountability'])}${field('explain','What is one question you have about responsible AI?','I wonder whether…')}`,'Save opening pulse');
if(data.phase===1)content=form('reflection',`<div class="panel"><b>Slides 14, 20, 22–23</b><p>AI literacy asks us to move from capability to judgment. A strong argument includes stakeholders, benefits, evidence, risks, and safeguards.</p></div>${choose('What matters most in an AI decision?',['Fairness','Privacy','Transparency','Ownership','Accountability'])}${field('benefit','Describe one plausible benefit of an AI system.','The system could…')}${field('tradeoff','What could be lost or harmed?','A stakeholder may…')}${field('researchQuestion','Start thinking about your Gen Ed infographic: what is one specific question you could investigate?','Should…')}`,'Save reflection');
if(data.phase===2)content=`<div class="card">${team?caseCard(team):''}</div><section class="card"><h3>Team investigation · slide 14</h3><p>Discuss together, then each student may submit their own reasoning. Your instructor can review all responses.</p>${form('verdict',`${choose('Your decision',['Yes','No','Only under certain conditions'])}${field('benefit','What problem does the AI solve?')}${field('stakeholders','Name at least three affected stakeholder groups.')}${choose('Most important ethics lens',['Fairness','Privacy','Transparency','Ownership','Accountability'])}${field('reason','Why is that lens especially important here?')}${field('safeguard','Require one specific safeguard or rule.')}`,'Submit my verdict')}</section>`;
if(data.phase===3)content=`<section class="card"><h3>Gallery critique · slide 19</h3><p>Review a different team's case. Challenge an assumption, stakeholder, risk or safeguard. Submit a question—not a grade.</p>${form('critique',`<label for="target">Which group are you reviewing?</label><select name="target" id="target">${data.cases.filter(x=>x.id!==userTeam).map(x=>`<option value="${x.team}">${x.team} · ${escapeHTML(x.title)}</option>`).join('')}</select>${choose('Critique lens',['Assumption','Missing stakeholder','Underestimated risk','Better safeguard'])}${field('challenge','Your question or constructive challenge','What if…')}${choose('Would your decision change after hearing other perspectives?',['Yes','No','I need more evidence'])}`,'Submit my critique')}</section>`;
if(data.phase===4)content=`<section class="card"><h3>Design the November 17 visit</h3><div class="panel">Create a short interactive AI experience for visiting high school students. Use your team's case or another specific AI issue. Prioritize excitement <em>and</em> critical thinking.</div>${form('visitIdea',`${field('title','Give your activity a memorable name.','','input')}${field('activity','What will the visitors actually do?','They will…')}${field('learning','What should visitors learn?','They should discover…')}${choose('Format',['Live vote','Interactive experiment','Ethics challenge','Game or competition','Other'])}${choose('Duration',['5 minutes','10 minutes','15 minutes'])}${field('technology','What digital interaction would you need?','Class Runner poll +…')}${field('risk','What could confuse visitors or go wrong?')}`,'Submit activity idea')}</section>`;
if(data.phase===5)content=`<section class="card"><h3>Gen Ed Signature Assignment · slides 22–27</h3><p>Start your <strong>AI Implications Infographic</strong>. You do not need an answer yet. You need a researchable question and a plan for credible evidence.</p><div class="panel"><b>Expectations</b><p>At least two credible, non-AI sources; evidence, multiple perspectives, responsible choices, readable communication, and transparent documentation of AI assistance. Do not enter sensitive or identifying information into AI tools.</p></div>${form('exit',`${field('topic','My likely infographic topic or AI issue…','Example: AI tutors accessing academic records')}${field('question','My specific researchable question…','Should [organization] use [AI tool] to [decision] when [consequence]?')}${field('stakeholder','One stakeholder I need to understand better…')}${field('evidence','One question I need credible evidence to answer…')}${field('responsibility','One thing responsible AI use requires…')}${field('visitVote','Optional: Which high school activity idea should we use, and why?','','textarea',false)}`,'Save my signature-assignment starter')}</section>`;
return g+(message?`<div class="success">${escapeHTML(message)}</div>`:'')+content+`<div class="card small muted">Instructor controls the current activity. Your previously submitted answers remain saved when the activity changes.</div>`}
function countTypes(){const m={};for(const s of admin?.submissions||[])m[s.type]=(m[s.type]||0)+1;return m}
function instructor(){if(!pin||!admin)return `<section class="card"><h2>Instructor control</h2><p>Enter the classroom instructor PIN. It is configured on the server; student views do not require it.</p><form id="pinform">${field('pin','Instructor PIN','','input')}<button>Unlock controls</button></form>${message?`<p class="alert">${escapeHTML(message)}</p>`:''}</section>`;const p=pp(),s=slide(),counts=countTypes();return `<div class="row between"><div><span class="badge">LIVE CONTROL · PHASE ${data.phase+1}/${data.phases.length}</span><h2>${escapeHTML(p.name)}</h2><p class="muted">${p.minutes} minutes · source slide ${s.n}</p></div><div class="row"><button class="secondary" data-action="backphase" ${data.phase===0?'disabled':''}>← Phase</button><button data-action="nextphase" ${data.phase===data.phases.length-1?'disabled':''}>Next phase →</button></div></div>${timeline()}<div class="grid"><section class="card"><h3>Teaching sequence</h3><div class="grid">${data.phases.map((x,i)=>`<button class="phasebtn ${i===data.phase?'selected':''}" data-phase="${i}"><b>${i+1}. ${escapeHTML(x.name)}</b><br><small>${x.minutes} min</small></button>`).join('')}</div><hr><div class="row"><button class="secondary" data-action="backslide" ${data.slide===0?'disabled':''}>← Card</button><strong>Slide ${s.n} · ${data.slide+1}/${p.slides.length}</strong><button data-action="nextslide" ${data.slide===p.slides.length-1?'disabled':''}>Next card →</button></div><p class="small muted">These are native Class Runner content cards based on your deck. They do not control Google Slides.</p><div class="row"><button class="secondary" data-action="reveal">${data.reveal?'Hide':'Show'} discussion prompt</button><button class="secondary" data-action="refresh">Refresh responses</button></div></section><section class="card"><h3>Projector preview</h3><div class="slides" style="min-height:260px;padding:25px"><span class="badge">SOURCE SLIDE ${s.n}</span><h2 style="font-size:28px">${escapeHTML(s.title)}</h2><p style="font-size:16px">${escapeHTML(s.body)}</p></div><p class="small muted">Open the Projector link on the room display. Student devices update when you change phases.</p><div class="row"><a target="_blank" href="#room" onclick="window.open(location.origin+'/#room','classroomProjector');return false">Open Projector ↗</a><a target="_blank" href="#student" onclick="window.open(location.origin+'/#student','testStudent');return false">Test Student ↗</a></div></section></div>
<div class="grid g4">${[['Students',Object.keys(admin.students).length],['Opening polls',counts.pulse||0],['Team verdicts',counts.verdict||0],['Visit ideas',counts.visitIdea||0]].map(([k,v])=>`<div class="card"><div class="muted small">${k}</div><div class="kpi">${v}</div></div>`).join('')}</div>
<div class="card"><div class="row between"><h3>Saved student work</h3><button class="secondary" data-action="export">Download CSV</button></div><div class="scroll">${admin.submissions.length?admin.submissions.slice().reverse().slice(0,90).map(x=>`<div class="entry"><div class="row"><span class="badge">${escapeHTML(x.type)}</span><b>${escapeHTML(admin.students[x.studentId]?.name||'Unknown')}</b><span class="small muted">${escapeHTML(admin.students[x.studentId]?.team||'')} · ${new Date(x.at).toLocaleTimeString()}</span></div>${Object.entries(x.payload).map(([k,v])=>`<p class="small"><strong>${escapeHTML(k)}:</strong> ${escapeHTML(v)}</p>`).join('')}</div>`).join(''):'<p class="muted">No student submissions yet.</p>'}</div></div><div class="card"><h3>Before class</h3><p class="small muted">Confirm two devices can join, instructor progression changes both screens, all response types save, and CSV downloads. Keep projected raw student text private; this app shows detailed submissions only in the PIN-protected instructor screen.</p></div>`}
function render(){if(!data)return;header();app.innerHTML=mode()==='room'?room():mode()==='instructor'?instructor():student();attach()}
function formPayload(form){let result={};const f=new FormData(form);for(const [k,v]of f.entries())result[k]=v;return result}
function attach(){q('#joinform')?.addEventListener('submit',async e=>{e.preventDefault();const x=formPayload(e.currentTarget);try{const r=await api('/api/join','POST',{...x,id:userId});userId=r.id;userName=x.name;userTeam=x.team;localStorage.setItem('ethicsUserId',userId);localStorage.setItem('ethicsUserName',userName);localStorage.setItem('ethicsUserTeam',userTeam);message='Joined successfully.';render()}catch(err){message=err.message;render()}});
q('#pinform')?.addEventListener('submit',async e=>{e.preventDefault();pin=q('#pin').value;sessionStorage.setItem('instructorPin',pin);await loadAdmin()});
q('#switchteam')?.addEventListener('click',()=>{userId='';localStorage.removeItem('ethicsUserId');render()});
document.querySelectorAll('form[data-submit]').forEach(f=>f.addEventListener('submit',async e=>{e.preventDefault();const type=f.dataset.submit;const payload=formPayload(f);try{await api('/api/submit','POST',{studentId:userId,type,payload});message='Saved! You can revise by submitting again. The instructor can review both.';render()}catch(err){message='Not saved: '+err.message;render()}}));
document.querySelectorAll('[data-phase]').forEach(b=>b.addEventListener('click',()=>advance({phase:Number(b.dataset.phase)})));
document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',async()=>{const act=b.dataset.action;if(act==='export'){const r=await fetch('/api/instructor/export',{headers:{'X-Instructor-Pin':pin}});if(!r.ok){message='Could not export';render();return}const blob=await r.blob(),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='inf125-nov10-responses.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(act==='refresh')return loadAdmin();if(act==='nextphase')return advance({phase:data.phase+1});if(act==='backphase')return advance({phase:data.phase-1});if(act==='nextslide')return advance({slide:data.slide+1});if(act==='backslide')return advance({slide:data.slide-1});if(act==='reveal')return advance({reveal:!data.reveal})}))}
async function advance(x){try{data=await api('/api/instructor/advance','POST',x,true);await loadAdmin()}catch(e){message=e.message;render()}}
async function loadAdmin(){if(!pin)return;try{admin=await api('/api/instructor/data','GET',null,true);message='';render()}catch(e){admin=null;message=e.message;render()}}
window.addEventListener('hashchange',()=>{render();if(mode()==='instructor')loadAdmin()});sync().then(()=>{if(mode()==='instructor')loadAdmin()});setInterval(()=>{if(mode()==='instructor'&&pin)loadAdmin()},5000);
</script></body></html>
